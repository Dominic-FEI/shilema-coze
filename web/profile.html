<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾了么 · 个人主页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <script src="./js/theme.js"></script>
</head>
<body>
  <div class="page">
    <header id="app-header" class="app-chrome"></header>
    <main class="page__inner">
      <section class="page-hero reveal">
        <p class="xisu-mark">个人中心</p>
        <h1 class="brand">个人主页</h1>
        <p class="brand__tag">以学号注册。可改头像（保存后顶栏同步显示）、昵称、性别、学院；学号不可改。</p>
      </section>

      <!-- 登录 -->
      <section class="section reveal" id="panel-login" hidden>
        <h2 class="section__title">学号登录</h2>
        <p class="section__desc">演示账号：2021001001 / 2021002002，密码 123456。登录前须勾选下方协议。</p>
        <form id="login-form" class="panel" style="max-width: var(--width-narrow)">
          <label class="field">
            <span class="field__label">学号</span>
            <input class="input" name="studentId" required placeholder="完整学号" />
          </label>
          <label class="field">
            <span class="field__label">密码</span>
            <input class="input" type="password" name="password" required placeholder="至少 6 位" />
          </label>
          <div data-legal-mount="account" id="login-legal"></div>
          <div class="btn-group">
            <button type="submit" class="btn btn--primary">登录</button>
            <a class="btn btn--ghost" href="#" id="goto-register">注册新账号</a>
          </div>
        </form>
      </section>

      <!-- 注册 -->
      <section class="section reveal" id="panel-register" hidden>
        <h2 class="section__title">学号注册</h2>
        <p class="section__desc">注册后可发布失物与闲置，并参与联系方式互换。</p>
        <form id="register-form" class="panel" style="max-width: var(--width-narrow)">
          <div class="field-row">
            <label class="field">
              <span class="field__label">学号（账号）</span>
              <input class="input" name="studentId" required placeholder="6～20 位数字" />
            </label>
            <label class="field">
              <span class="field__label">密码</span>
              <input class="input" type="password" name="password" required placeholder="至少 6 位" />
            </label>
          </div>
          <div class="field-row">
            <label class="field">
              <span class="field__label">真实姓名</span>
              <input class="input" name="realName" required />
            </label>
            <label class="field">
              <span class="field__label">昵称</span>
              <input class="input" name="nickname" placeholder="对外展示" />
            </label>
          </div>
          <div class="field-row">
            <label class="field">
              <span class="field__label">性别</span>
              <select class="select" name="gender">
                <option value="保密">保密</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </label>
            <label class="field">
              <span class="field__label">学院</span>
              <input class="input" name="college" required placeholder="如：英文学院" />
            </label>
          </div>
          <label class="field">
            <span class="field__label">手机号（建议填写）</span>
            <input class="input" name="phone" inputmode="tel" placeholder="闲置互换时使用" />
          </label>
          <div data-legal-mount="account" id="register-legal"></div>
          <div class="btn-group">
            <button type="submit" class="btn btn--primary">注册并登录</button>
            <a class="btn btn--ghost" href="#" id="goto-login">已有账号</a>
          </div>
        </form>
      </section>

      <!-- 资料 -->
      <section class="section reveal" id="panel-profile" hidden>
        <div class="profile-head">
          <img class="avatar avatar--lg" id="profile-avatar" alt="头像" />
          <div>
            <h2 class="profile-head__name" id="profile-name">昵称</h2>
            <p class="profile-head__sub" id="profile-sub">学号 · 性别 · 姓名</p>
          </div>
        </div>

        <h2 class="section__title">编辑资料</h2>
        <p class="section__desc">学号不可修改。可更新头像、昵称、性别、姓名与手机号。</p>
        <form id="profile-form" class="panel" style="max-width: var(--width-narrow)">
          <div class="avatar-upload field">
            <span class="field__label">头像</span>
            <input class="input" type="file" name="avatar" accept="image/*" />
            <span class="field__hint">建议小于 800KB</span>
          </div>
          <div class="field-row">
            <label class="field">
              <span class="field__label">昵称</span>
              <input class="input" name="nickname" required />
            </label>
            <label class="field">
              <span class="field__label">性别</span>
              <select class="select" name="gender">
                <option value="保密">保密</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </label>
          </div>
          <div class="field-row">
            <label class="field">
              <span class="field__label">真实姓名</span>
              <input class="input" name="realName" required />
            </label>
            <label class="field">
              <span class="field__label">学院</span>
              <input class="input" name="college" required placeholder="所属学院" />
            </label>
          </div>
          <label class="field">
            <span class="field__label">手机号</span>
            <input class="input" name="phone" inputmode="tel" />
          </label>
          <label class="field">
            <span class="field__label">新密码（留空则不改）</span>
            <input class="input" type="password" name="password" placeholder="至少 6 位" />
          </label>
          <div class="btn-group">
            <button type="submit" class="btn btn--primary">保存资料</button>
            <button type="button" class="btn btn--ghost" id="btn-switch">切换账号</button>
            <button type="button" class="btn btn--ghost" id="btn-logout">注销</button>
          </div>
        </form>

        <p class="notice" style="margin-top: var(--space-5)">
          <strong>本地演示：</strong>数据保存在浏览器 localStorage。
          <button type="button" class="btn btn--ghost" id="btn-reset-demo" style="margin-left: var(--space-2)">重置示例数据</button>
        </p>
      </section>
    </main>
    <footer class="site-footer" id="app-footer"></footer>
  </div>

  <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.10/libs/cn/index.js"></script>
  <script src="./js/version.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/legal.js"></script>
  <script src="./js/shell.js"></script>
  <script src="./js/mobile-shell.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/chat.js"></script>
  <script src="./js/pages/profile.js"></script>
</body>
</html>
